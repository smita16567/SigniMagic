<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SigniMagic | Favourites</title>
<!-- ✅ NEW: PWA Support -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#00c6ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="/icons/icon-192x192.png">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', sans-serif;
    background: #0f0f1a;
    color: #fff;
    min-height: 100vh;
}

/* TOP NAV */
.top-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 30px;
    background: rgba(15, 15, 26, 0.95);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(255,255,255,0.08);
    position: sticky;
    top: 0;
    z-index: 100;
}

.nav-left {
    display: flex;
    align-items: center;
    gap: 12px;
}

.nav-left img {
    width: 36px;
    height: 36px;
    border-radius: 10px;
}

.nav-left span {
    font-weight: 700;
    font-size: 18px;
    background: linear-gradient(135deg, #f472b6, #7c3aed);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.nav-right {
    display: flex;
    align-items: center;
    gap: 16px;
}

.back-btn {
    padding: 8px 20px;
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.15);
    background: transparent;
    color: #ccc;
    font-size: 13px;
    cursor: pointer;
    transition: 0.3s;
    text-decoration: none;
}

.back-btn:hover {
    background: rgba(255,255,255,0.1);
    color: #fff;
}

/* PAGE HEADER */
.page-header {
    text-align: center;
    padding: 50px 20px 30px;
}

.page-header h1 {
    font-size: 36px;
    font-weight: 800;
    margin-bottom: 8px;
}

.page-header h1 .gradient {
    background: linear-gradient(135deg, #f472b6, #ec4899, #7c3aed);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.page-header p {
    color: #888;
    font-size: 15px;
}

.fav-count {
    display: inline-block;
    background: rgba(244, 114, 182, 0.15);
    color: #f472b6;
    padding: 4px 14px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    margin-top: 12px;
}

/* CATEGORY TABS */
.tabs {
    display: flex;
    justify-content: center;
    gap: 10px;
    padding: 0 20px 30px;
    flex-wrap: wrap;
}

.tab {
    padding: 10px 24px;
    border-radius: 25px;
    border: 1px solid rgba(255,255,255,0.1);
    background: transparent;
    color: #888;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: 0.3s;
}

.tab:hover {
    border-color: rgba(244, 114, 182, 0.4);
    color: #f472b6;
}

.tab.active {
    background: linear-gradient(135deg, #f472b6, #7c3aed);
    color: white;
    border-color: transparent;
    box-shadow: 0 4px 15px rgba(244, 114, 182, 0.3);
}

/* PINTEREST CARD GRID */
.card-grid {
    columns: 3;
    column-gap: 20px;
    padding: 0 40px 60px;
    max-width: 1200px;
    margin: 0 auto;
}

.fav-card {
    break-inside: avoid;
    background: rgba(255,255,255,0.05);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 20px;
    border: 1px solid rgba(255,255,255,0.08);
    transition: all 0.3s ease;
    position: relative;
}

.fav-card:hover {
    border-color: rgba(244, 114, 182, 0.3);
    transform: translateY(-4px);
    box-shadow: 0 12px 30px rgba(0,0,0,0.3);
}

.card-icon {
    font-size: 40px;
    margin-bottom: 12px;
}

.card-category {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 600;
    margin-bottom: 10px;
}

.card-category.sign { background: rgba(59,130,246,0.15); color: #60a5fa; }
.card-category.lesson { background: rgba(34,197,94,0.15); color: #4ade80; }
.card-category.module { background: rgba(251,146,60,0.15); color: #fb923c; }

.fav-card h3 {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 6px;
    color: #f0f0f0;
}

.fav-card p {
    font-size: 13px;
    color: #888;
    line-height: 1.5;
    margin-bottom: 14px;
}

.card-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.saved-date {
    font-size: 11px;
    color: #555;
}

.remove-btn {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: none;
    background: rgba(239, 68, 68, 0.1);
    color: #ef4444;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
    display: flex;
    align-items: center;
    justify-content: center;
}

.remove-btn:hover {
    background: rgba(239, 68, 68, 0.25);
    transform: scale(1.1);
}

/* EMPTY STATE */
.empty-state {
    text-align: center;
    padding: 80px 20px;
    display: none;
}

.empty-state.show {
    display: block;
}

.empty-state .icon {
    font-size: 64px;
    margin-bottom: 16px;
}

.empty-state h3 {
    font-size: 20px;
    color: #666;
    margin-bottom: 8px;
}

.empty-state p {
    color: #555;
    font-size: 14px;
}

/* RESPONSIVE */
@media (max-width: 900px) {
    .card-grid { columns: 2; padding: 0 20px 40px; }
}

@media (max-width: 600px) {
    .card-grid { columns: 1; padding: 0 16px 40px; }
    .page-header h1 { font-size: 28px; }
}
</style>
</head>
<body>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<!-- TOP NAV -->
<nav class="top-nav">
    <div class="nav-left">
        <img src="images/logo.jpeg" alt="Logo">
        <span>SigniMagic</span>
    </div>
    <div class="nav-right">
        <a href="dashboard.html" class="back-btn">&larr; Back to Dashboard</a>
    </div>
</nav>

<!-- PAGE HEADER -->
<div class="page-header">
    <h1>Your <span class="gradient">Favourites</span> &#10084;&#65039;</h1>
    <p>All your saved signs, lessons, and modules in one place</p>
    <div class="fav-count" id="favCount">0 items saved</div>
</div>

<!-- CATEGORY TABS -->
<div class="tabs">
    <button class="tab active" onclick="filterCategory('all', this)">All</button>
    <button class="tab" onclick="filterCategory('sign', this)">🤟 Saved Signs</button>
    <button class="tab" onclick="filterCategory('lesson', this)">📚 Liked Lessons</button>
    <button class="tab" onclick="filterCategory('module', this)">📦 Bookmarked Modules</button>
</div>

<!-- CARD GRID -->
<div class="card-grid" id="cardGrid"></div>

<!-- EMPTY STATE -->
<div class="empty-state" id="emptyState">
    <div class="icon">💔</div>
    <h3>No favourites yet</h3>
    <p>Start exploring and save signs, lessons, or modules you love!</p>
</div>

<script>
// ===== Firebase Config =====
const firebaseConfig = {
    apiKey: "AIzaSyC2JaKO_UryvZSBNUk193tXUnxr9zYSTEY",
    authDomain: "signimagic-8e3a7.firebaseapp.com",
    projectId: "signimagic-8e3a7",
    storageBucket: "signimagic-8e3a7.firebasestorage.app",
    messagingSenderId: "203818581183",
    appId: "1:203818581183:web:62a4712a67027b7453da0a"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let allFavourites = [];
let currentFilter = 'all';

// ===== Check Auth & Load Favourites =====
auth.onAuthStateChanged((user) => {
    if (user) {
        loadFavourites(user.uid);
    } else {
        window.location.href = "login.html";
    }
});

function loadFavourites(uid) {
    db.collection("users").doc(uid).collection("favourites")
    .orderBy("savedAt", "desc")
    .onSnapshot((snapshot) => {
        allFavourites = [];
        snapshot.forEach((doc) => {
            allFavourites.push({ id: doc.id, ...doc.data() });
        });
        renderCards();
    });
}

// ===== Render Cards =====
function renderCards() {
    const grid = document.getElementById("cardGrid");
    const emptyState = document.getElementById("emptyState");
    const countEl = document.getElementById("favCount");

    let filtered = allFavourites;
    if (currentFilter !== 'all') {
        filtered = allFavourites.filter(f => f.category === currentFilter);
    }

    countEl.textContent = filtered.length + " item" + (filtered.length !== 1 ? "s" : "") + " saved";

    if (filtered.length === 0) {
        grid.innerHTML = "";
        emptyState.classList.add("show");
        return;
    }

    emptyState.classList.remove("show");
    const icons = { sign: "\u{1f91f}", lesson: "\u{1f4da}", module: "\u{1f4e6}" };

    grid.innerHTML = filtered.map(item => {
        let date = "Recently";
        if (item.savedAt && item.savedAt.toDate) {
            date = new Date(item.savedAt.toDate()).toLocaleDateString();
        }
        return `
            <div class="fav-card" data-category="${item.category}">
                <div class="card-icon">${icons[item.category] || "\u2764\ufe0f"}</div>
                <span class="card-category ${item.category}">${item.category}</span>
                <h3>${item.title}</h3>
                <p>${item.description || ""}</p>
                <div class="card-footer">
                    <span class="saved-date">Saved ${date}</span>
                    <button class="remove-btn" onclick="removeFavourite('${item.id}')" title="Remove">\u2715</button>
                </div>
            </div>
        `;
    }).join("");
}

// ===== Filter by Category =====
function filterCategory(category, btn) {
    currentFilter = category;
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    btn.classList.add("active");
    renderCards();
}

// ===== Remove a Favourite =====
function removeFavourite(favId) {
    const user = auth.currentUser;
    if (!user) return;

    db.collection("users").doc(user.uid)
      .collection("favourites").doc(favId).delete()
    .then(() => {
        console.log("Removed from favourites");
    })
    .catch((err) => {
        alert("Error removing: " + err.message);
    });
}

// ===== Add to Favourites (use from other pages) =====
// Call: addToFavourites("Hello Sign", "How to sign Hello", "sign")
// Categories: "sign", "lesson", or "module"
function addToFavourites(title, description, category) {
    const user = auth.currentUser;
    if (!user) {
        alert("Please login first!");
        return;
    }

    db.collection("users").doc(user.uid).collection("favourites").add({
        title: title,
        description: description,
        category: category,
        savedAt: firebase.firestore.FieldValue.serverTimestamp()
    })
    .then(() => {
        alert("Added to favourites!");
    })
    .catch((err) => {
        alert("Error: " + err.message);
    });
}
</script>
 </body>

<!-- ✅ NEW: Service Worker Registration -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js')
        .then(reg => console.log('SW registered:', reg.scope))
        .catch(err => console.log('SW registration failed:', err));
    });
  }
</script>
</body>
</html>
