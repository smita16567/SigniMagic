<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings</title>
<!-- ✅ NEW: PWA Support -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#00c6ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="/icons/icon-192x192.png">

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: #f4f6f9;
}

/* Container */
.settings-container {
    max-width: 600px;
    margin: 40px auto;
    background: white;
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
}

/* Title */
h2 {
    text-align: center;
    margin-bottom: 20px;
}

/* Section */
.section {
    margin-bottom: 20px;
}

.section h3 {
    margin-bottom: 10px;
    color: #333;
}

/* Input */
input, select {
    width: 100%;
    padding: 8px;
    margin: 5px 0 10px;
    border-radius: 8px;
    border: 1px solid #ccc;
}

/* Toggle Switch */
.switch {
    display: flex;
    justify-content: space-between;
    margin: 10px 0;
}

button {
    padding: 10px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    margin-top: 5px;
}

/* Buttons */
.save-btn {
    width: 100%;
    background: #4CAF50;
    color: white;
}

.logout-btn {
    width: 100%;
    background: #ff4d4d;
    color: white;
}
.goog-te-banner-frame.skiptranslate {
    display: none !important;
}

body {
    top: 0px !important;
}
.about-app {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: bold;
    font-size: 18px;
}

.logo {
    width: 40px;
    height: 40px;
    border-radius: 8px;
}
</style>
</head>

<body>

<div class="settings-container">

<h2>⚙️ Settings</h2>

<!-- 👤 Profile -->
<div class="section">
<h3>👤 Profile</h3>
<input type="text" placeholder="Enter Name">
<input type="email" placeholder="Enter Email">
<input type="password" placeholder="Change Password">
</div>

<!-- 🔊 Audio -->
<div class="section">
<h3>🔊 Audio Settings</h3>
<div class="switch">
<label>Enable Voice</label>
<input type="radio" name="voiceToggle" value="on">

<label>Disable Voice</label>
<input type="radio" name="voiceToggle" value="off">

<label>Speech Speed</label>
<input type="range" min="1" max="5">
</div>

<!-- 🌐 Language -->
<div class="section">
<h3>🌐 Language</h3>
<div id="google_translate_element"></div>

<!-- 🎨 Theme -->
<div class="section">
<h3>🎨 Theme</h3>
<select id="themeSelect">
<option value="light">Light Mode</option>
<option value="dark">Dark Mode</option>
</select>
</div>

<!-- 🔔 Notifications -->
<div class="section">
<h3>🔔 Notifications</h3>
<div class="switch">
<label>Enable Notifications</label>
<input type="radio" id="notifToggle" name="notifToggle">
<label>Disable Notifications</label>
<input type="radio" id="notifToggle" name="notifToggle">
</div>
</div>

<!-- 📊 Progress -->
<div class="section">
<h3>📊 Progress</h3>
<button onclick="resetProgress()">Reset Progress</button>
</div>

<!-- 🔒 Security -->
<div class="section">
<h3>🔒 Security</h3>
<button class="logout-btn" onclick="logout()">Logout</button>
</div>

<!-- ℹ️ About -->
<div class="section">
<h3>ℹ️ About</h3>
<div class="about-app">
        <img src="images/logo.jpeg" alt="App Logo" class="logo">
        <span>SigniMagic - Smart Sign Language Converter</span>
    </div>

<p>Developer: Smita Bacchewar <br>
              Dhanshri Chitmalwar
</p>
</div>

<button class="save-btn" onclick="saveSettings()">Save Settings</button>

</div>

<script>
function saveSettings() {
    let name = document.querySelector("input[type='text']").value;
    let email = document.querySelector("input[type='email']").value;
    let theme = document.getElementById("themeSelect").value;

    let voice = document.querySelector("input[name='voiceToggle']:checked")?.value;
    let notif = document.querySelector("input[name='notifToggle']:checked")?.value;

    localStorage.setItem("name", name);
    localStorage.setItem("email", email);
    localStorage.setItem("theme", theme);
    localStorage.setItem("voice", voice);
    localStorage.setItem("notification", notif);

    alert("Settings saved successfully!");
}
/* Logout */
function logout() {
    localStorage.clear();
    window.location.href = "login.html";
}

/* Reset Progress */
function resetProgress() {
    localStorage.removeItem("progress");
    alert("Progress Reset!");
}

/* Theme Change */
document.getElementById("themeSelect").addEventListener("change", function() {
    if (this.value === "dark") {
        document.body.style.background = "#222";
        document.body.style.color = "white";
    } else {
        document.body.style.background = "#f4f6f9";
        document.body.style.color = "black";
    }
});

</script>
<script type="text/javascript">
function googleTranslateElementInit() {
  new google.translate.TranslateElement(
    {
      pageLanguage: 'en',
      includedLanguages: 'en,hi,mr',
      layout: google.translate.TranslateElement.InlineLayout.SIMPLE
    },
    'google_translate_element'
  );
}
</script>

<script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
<!-- ✅ NEW: Service Worker Registration -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js')
        .then(reg => console.log('SW registered:', reg.scope))
        .catch(err => console.log('SW registration failed:', err));
    });
  }
</script>
</body>
</html>
